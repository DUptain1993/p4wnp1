name: Build Raspberry Pi Zero W P4wnP1 A.L.O.A

on:
  workflow_dispatch:
  push:
    paths:
      - "raspberry-pi-zero-w-p4wnp1-aloa.sh"
      - "common.d/**"
      - "bsp/**"
      - "patches/**"
      - "devices.yml"
      - ".github/workflows/build-rpi-zero-w-p4wnp1-aloa.yml"

concurrency:
  group: build-rpi-zero-w-p4wnp1-aloa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: read

    env:
      DEBIAN_FRONTEND: noninteractive
      TERM: xterm-256color
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure QEMU user emulation
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support
          sudo update-binfmts --enable

      - name: Reset QEMU binfmt handlers
        continue-on-error: true
        run: |
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

      - name: Prepare swap for kernel build stability
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Install host build dependencies
        run: sudo ./common.d/build_deps.sh

      - name: Build Raspberry Pi Zero W P4wnP1 A.L.O.A image
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Build attempt ${attempt}/3"
            if sudo ./raspberry-pi-zero-w-p4wnp1-aloa.sh; then
              echo "Build succeeded on attempt ${attempt}"
              exit 0
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "Build failed after 3 attempts"
              exit 1
            fi
            echo "Build failed; cleaning partial output and retrying in 30s..."
            sudo rm -rf base/raspberry-pi-zero-w-p4wnp1-aloa-* images/*.img images/*.img.* || true
            sleep 30
          done

      - name: Fix artifact ownership
        if: always()
        run: sudo chown -R "$USER:$USER" images logs || true

      - name: Upload generated image artifacts
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: raspberry-pi-zero-w-p4wnp1-aloa-image
          path: |
            images/*
            logs/*.log
          if-no-files-found: error
          retention-days: 14

      - name: Tear down swap
        if: always()
        run: sudo swapoff /swapfile || true
