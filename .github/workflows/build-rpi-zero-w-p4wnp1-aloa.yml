name: Build Raspberry Pi Zero W P4wnP1 A.L.O.A

on:
  workflow_dispatch:
  push:
    paths:
      - "raspberry-pi-zero-w-p4wnp1-aloa.sh"
      - "common.d/**"
      - "bsp/**"
      - "patches/**"
      - "devices.yml"
      - ".github/workflows/build-rpi-zero-w-p4wnp1-aloa.yml"

concurrency:
  group: build-rpi-zero-w-p4wnp1-aloa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: read

    env:
      DEBIAN_FRONTEND: noninteractive
      TERM: xterm-256color
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Free disk space
        # The build script requires >=30 GiB free, but a stock ubuntu-22.04
        # runner only has ~14 GiB free after mmdebstrap creates the rootfs
        # (the rest is consumed by preinstalled toolchains this build never
        # uses: .NET, Android SDK, GHC/Haskell, CodeQL bundles, Docker images).
        # Strip those out first so the script's disk check actually passes.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache "${AGENT_TOOLSDIRECTORY:-}" || true
          sudo docker image prune --all --force || true
          sudo apt-get clean
          df -h /

      - name: Prepare swap for kernel build stability
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Install host build dependencies
        run: sudo ./common.d/build_deps.sh

      - name: Verify QEMU armhf emulation
        run: |
          test -x /usr/bin/qemu-arm-static
          sudo update-binfmts --enable
          # Jammy qemu-user-static ships qemu-arm-static; mmdebstrap uses that for armhf.
          if [ ! -e /usr/bin/qemu-armhf-static ]; then
            sudo ln -sf qemu-arm-static /usr/bin/qemu-armhf-static
          fi
          ls -l /usr/bin/qemu-arm-static /usr/bin/qemu-armhf-static

      - name: Reset QEMU binfmt handlers
        continue-on-error: true
        run: |
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
          test -x /usr/bin/qemu-arm-static

      - name: Build Raspberry Pi Zero W P4wnP1 A.L.O.A image
        run: |
          set -euo pipefail
          attempts=2
          for attempt in $(seq 1 "${attempts}"); do
            echo "Build attempt ${attempt}/${attempts}"
            if sudo ./raspberry-pi-zero-w-p4wnp1-aloa.sh; then
              echo "Build succeeded on attempt ${attempt}"
              exit 0
            fi
            if [ "${attempt}" -eq "${attempts}" ]; then
              echo "Build failed after ${attempts} attempts"
              exit 1
            fi
            echo "Build failed; cleaning partial output and retrying in 30s..."
            sudo rm -rf base/raspberry-pi-zero-w-p4wnp1-aloa-* images/*.img images/*.img.* || true
            sleep 30
          done

      - name: Fix artifact ownership
        if: always()
        run: sudo chown -R "$USER:$USER" images logs || true

      - name: Upload generated image artifacts
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: raspberry-pi-zero-w-p4wnp1-aloa-image
          path: |
            images/*
            logs/*.log
          if-no-files-found: error
          retention-days: 14

      - name: Tear down swap
        if: always()
        run: sudo swapoff /swapfile || true
